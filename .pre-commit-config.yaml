# pre-commit 钩子：提交前自动检查代码质量 + 防密钥泄露
# 安装：pre-commit install（首次设置后自动生效）
# 手动跑：pre-commit run --all-files

repos:
  # === 通用检查（基础卫生）===
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key        # 检测私钥文件
      - id: check-added-large-files   # 防止提交大文件（>500KB）
        args: ['--maxkb=500']
      - id: check-merge-conflict      # 检查未解决的合并冲突
      - id: end-of-file-fixer         # 文件末尾换行
      - id: trailing-whitespace       # 去除行尾空格

  # === 密钥检测（防 API key 泄露）===
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks                   # 扫描代码里的 API key / token

  # === 零依赖密钥模式扫描（gitleaks 需要 Go 二进制，此钩子保底）===
  # Stage 7a A-4：dev_workflow.md 5.2 承诺的 sk-/token 模式检查落地。
  # .env 本身被 gitignore；这里防的是把 key 粘进代码/文档/测试后误提交。
  # 只匹配 sk- + 纯字母数字体（OpenAI/DeepSeek 等真实格式）；
  # 带连字符的占位符（sk-your-api-key-here）和测试夹具不会误报。
  - repo: local
    hooks:
      - id: secret-pattern-scan
        name: 密钥模式扫描（sk- 前缀 API key）
        entry: >-
          bash -c 'if grep -RInE "sk-[A-Za-z0-9]{16,}" "$@"; then echo "检测到疑似 API key（sk- 前缀），提交已阻止"; exit 1; fi' --
        language: system

  # === Python：ruff（lint + format，与 CI 对齐，不带 --fix）===
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ['check']
        files: ^engine/
      - id: ruff-format
        args: ['--check']
        files: ^engine/

  # === 前端：prettier（格式化）===
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: ^web/.*\.(ts|tsx|js|jsx|json|css|md)$
